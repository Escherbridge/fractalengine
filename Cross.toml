# cross-rs config for ARM GNU targets (release_ci_20260429 Task 2.4 / FR-6).
# Musl relay builds use cargo-zigbuild instead — see .github/workflows/release.yml.

[build.env]
passthrough = ["CARGO_TERM_COLOR", "RUST_LOG", "RUST_MIN_STACK"]

[target.aarch64-unknown-linux-gnu]
image = "ghcr.io/cross-rs/aarch64-unknown-linux-gnu:edge"
