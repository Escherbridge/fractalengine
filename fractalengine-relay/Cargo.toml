[package]
name = "fractalengine-relay"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Headless FractalEngine relay server"

[[bin]]
name = "fe-relay"
path = "src/main.rs"

[dependencies]
fe-runtime  = { path = "../fe-runtime" }
fe-network  = { path = "../fe-network" }
fe-database = { path = "../fe-database" }
fe-identity = { path = "../fe-identity", default-features = false }
fe-sync     = { path = "../fe-sync" }
fe-api      = { path = "../fe-api" }
fe-entity-store = { path = "../fe-entity-store" }
fe-terrain  = { path = "../fe-terrain" }
bevy        = { workspace = true }
crossbeam   = { workspace = true }
tokio       = { workspace = true }
tracing     = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow      = { workspace = true }
surrealdb   = { workspace = true }
serde_json  = { workspace = true }
hex         = "0.4"
# F9/A20 sim lab control surface — default OFF (fe-sim drags in the test
# harness; see fe-sim/src/AGENTS.md §session for the process-global hazards).
fe-sim      = { path = "../fe-sim", optional = true }

[features]
default = []
sim-control = ["dep:fe-sim"]
