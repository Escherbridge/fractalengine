[package]
name = "fe-ext"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Authoring CLI for FractalEngine extensions: scaffold, build, validate, pack, sign, inspect, sandbox run"

[lib]
name = "fe_ext"
path = "src/lib.rs"

[[bin]]
name = "fe-ext"
path = "src/main.rs"

[dependencies]
fe-sdk = { path = "../../fe-sdk" }
fe-format = { path = "../../fe-format" }
fe-hexon = { path = "../../fe-hexon" }
fe-plugin = { path = "../../fe-plugin" }
fe-plugin-test = { path = "../../fe-plugin-test" }
fe-sim-model = { path = "../../fe-sim/model" }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
blake3 = { workspace = true }
ed25519-dalek = { workspace = true }
crossbeam = { workspace = true }
hex = "0.4"
rand = "0.8"
base64 = "0.22"
zip = "0.6"
toml = "0.8"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
