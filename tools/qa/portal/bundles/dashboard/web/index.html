<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>QA Dashboard</title><link rel="stylesheet" href="style.css"></head>
<body>
<h1 data-fe-probe="title">QA Dashboard</h1>
<dl>
  <dt>Node</dt><dd data-fe-probe="node-name">-</dd>
  <dt>Position</dt><dd data-fe-probe="node-position">-</dd>
  <dt>Node count</dt><dd data-fe-probe="query-node-count">-</dd>
  <dt>Readings</dt><dd data-fe-probe="readings-count">0</dd>
  <dt>Status</dt><dd data-fe-probe="status">starting</dd>
  <dt>CSP</dt><dd data-fe-probe="csp">pending</dd>
</dl>
<button data-fe-slot="1" type="button">Focus target node</button>
<script src="/__fe/portal-v1.js"></script>
<script src="app.js"></script>
</body>
</html>
