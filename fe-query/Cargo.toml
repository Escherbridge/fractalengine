[package]
name = "fe-query"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Query builder and GIS query helpers for FractalEngine"

[features]
default = ["geo"]
graphql = ["dep:async-graphql"]
geo = []
# Lighter than `datafusion`: GeoParquet I/O without DataFusion (see src/AGENTS.md §geoparquet)
parquet = ["dep:parquet", "dep:arrow", "dep:fe-entity-store"]
datafusion = ["dep:datafusion", "dep:async-trait", "dep:fe-entity-store", "parquet"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }

# Optional
async-graphql = { version = "7", optional = true }
fe-entity-store = { path = "../fe-entity-store", optional = true }
async-trait = { version = "0.1", optional = true }
datafusion = { version = "46", optional = true, default-features = false, features = ["nested_expressions"] }
# arrow/parquet on datafusion-46's 54.x line (single arrow in tree); not in workspace root — fe-query is sole consumer
arrow = { version = "54", optional = true, default-features = false }
parquet = { version = "54", optional = true, default-features = false, features = ["arrow"] }

[dev-dependencies]
tokio = { workspace = true }
