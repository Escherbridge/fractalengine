[package]
name = "fe-terrain"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Terrain tiles, GPX ingestion, meshes, and map layers for FractalEngine"

[features]
default = []
render = ["bevy", "bevy_egui", "dep:fe-renderer"]
fetch = ["reqwest", "async-trait", "tokio", "ed25519-dalek"]

[dependencies]
gpx = "0.10"
geo-types = "0.7"
flat_projection = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { workspace = true }
serde_json = { workspace = true }
ulid = { workspace = true, features = ["serde"] }
earcutr = "0.4"
geojson = "0.24"
chrono = { version = "0.4", features = ["serde"] }
anyhow = { workspace = true }
thiserror = { workspace = true }
blake3 = { workspace = true }
dirs = "5"
tracing = { workspace = true }
fe-format = { path = "../fe-format" }
fe-sdk = { path = "../fe-sdk" }
# W2b F1: the streamed path's pinned-header check reuses fe-hexon's ONE
# `verify_fetched_header` (no third copy of the RequireSealed+pin logic).
# fe-hexon dev-depends on fe-terrain for its own P2P flow tests, which is a
# supported cargo dev-dependency cycle (not a build cycle) — see
# fe-terrain/src/AGENTS.md §streamed-tilesets.
fe-hexon = { path = "../fe-hexon" }
zip = { version = "2", default-features = false, features = ["deflate"] }
bincode = "1"

# Optional
bevy = { workspace = true, optional = true }
bevy_egui = { workspace = true, optional = true }
fe-renderer = { path = "../fe-renderer", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"], optional = true }
async-trait = { version = "0.1", optional = true }
tokio = { workspace = true, optional = true }
ed25519-dalek = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true }
# Only for building/sealing test fixtures (campaign plan p2p_asset_streaming
# S6, fe-terrain/tests/hexon_integrity_flow.rs) — the production `fetch`
# feature pulls in its own copy; this dev-only one lets the flow test seal
# fixtures without requiring --features fetch.
ed25519-dalek = { workspace = true }
# W2b F1 unit test (streamed.rs): a sealed `HeaderDoc` can only be read back
# via `HexonArchiveIndex::open`, which needs a real path.
tempfile = "3"
