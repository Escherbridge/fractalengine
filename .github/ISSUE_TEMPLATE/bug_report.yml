name: Bug report
description: Report a defect in FractalEngine
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. For anything security-sensitive, please use
        GitHub private vulnerability reporting instead (see SECURITY.md).
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Release version or `git rev-parse --short HEAD` if building from source.
      placeholder: "0.1.0 / dbc421d"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - Linux
        - macOS
    validations:
      required: true
  - type: dropdown
    id: binary
    attributes:
      label: Binary
      options:
        - fractalengine (GUI)
        - fe-relay (headless)
        - both / library
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what actually happened.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a map...
        2. Draw a path...
        3. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / output
      description: Relevant terminal output or panics. Automatically formatted as code.
      render: text
    validations:
      required: false
