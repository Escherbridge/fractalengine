name: Build Artifacts

# Produce runnable, downloadable packages for every build on `main` (and on
# PRs targeting it): per platform, a .zip (Windows) / .tar.gz (Linux) holding
# the GUI binary + its runtime assets + QUICKSTART.txt + licences, and the
# headless relay as its own archive (scripts/package_release.py,
# packaging/README.md). A package is uploaded only if compilation AND the test
# sweep pass -- a failed build/test step fails the job (and the run), so no
# broken binary is ever uploaded.
#
# Lint (fmt, clippy, cargo-deny, fuzz) is WARN-ONLY: findings surface as
# ::warning:: annotations plus a run-summary table, but they never fail the run
# and never gate build or test (RUNBOOK R7, 2026-10-13). ONE exception (AC-4):
# a crash FOUND by the fuzzer is an ::error and blocks the rolling `latest`
# publish -- see the lint job's `Fuzz verdict` step and `rolling-release`.
#
# This is the first slice of `release_ci_20260429`. The full pipeline (8-target
# matrix, tag-triggered GitHub Releases, Docker/GHCR image, code signing) stays
# in that track.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: build-artifacts-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Guard against the deep-recursion stack usage some dependencies (surrealdb
  # core) hit during compilation; harmless elsewhere.
  RUST_MIN_STACK: "134217728"
  # The workspace release profile (lto = "fat", codegen-units = 1) exceeds
  # hosted-runner memory on the Bevy binary link — the Linux job was
  # SIGTERM'd mid-link (run 29440668419). Thin LTO in CI only; local/user
  # release builds keep the fat-LTO profile from Cargo.toml.
  CARGO_PROFILE_RELEASE_LTO: thin
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"

jobs:
  # Warn-only quality gate. Every lint step has step-level
  # `continue-on-error: true`. Per the GitHub docs (contexts reference), a
  # failing step then reports `steps.<id>.outcome == 'failure'` but
  # `steps.<id>.conclusion == 'success'`, so the job still passes. The final
  # `Lint report` step reads each `outcome` and turns every failure into a
  # ::warning:: annotation + a $GITHUB_STEP_SUMMARY row. The job-level
  # `continue-on-error` is the backstop for a NON-lint failure here (apt
  # mirror, toolchain download): "prevents a workflow run from failing when a
  # job fails". Only `rolling-release` needs lint, and it reads just the
  # `fuzz_crash` output, never lint's result -- so lint can never skip
  # build/test, and only a found fuzz crash can hold back the publish.
  # Job outputs "are evaluated on the runner at the end of each job" (workflow
  # syntax reference, jobs.<job_id>.outputs) -- whether or not a step failed --
  # so the verdict survives the warn-only failures around it.
  lint:
    name: Lint (warn-only -- fmt, clippy, cargo-deny, fuzz)
    runs-on: ubuntu-latest
    continue-on-error: true
    outputs:
      # 'true' only when the fuzzer found a crash; '' or 'false' otherwise.
      fuzz_crash: ${{ steps.fuzz_verdict.outputs.fuzz_crash }}
    # 120: the bounded fuzz step adds a cold sanitizer build of fe-identity
    # (bevy + iroh) on top of clippy.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # Same native-dep set as the Linux build job: clippy runs every
      # build script, which probes pkg-config for the GUI stack.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            libdbus-1-dev libssl-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev \
            libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev \
            libgl1-mesa-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint
          # fuzz/ is a separate workspace; without this its sanitizer build is cold every run.
          workspaces: |
            . -> target
            fuzz -> target

      # `shell: bash` runs `bash -eo pipefail`, so `| tee` keeps the tool's exit code.
      - name: Check formatting
        id: fmt
        continue-on-error: true
        shell: bash
        run: cargo fmt --check 2>&1 | tee "$RUNNER_TEMP/lint-fmt.log"

      - name: Clippy (-D warnings)
        id: clippy
        continue-on-error: true
        shell: bash
        # --keep-going: one failing crate must not hide its dependents' lints.
        run: |
          cargo clippy --workspace --all-targets --keep-going --color never -- -D warnings \
            2>&1 | tee "$RUNNER_TEMP/lint-clippy.log"

      # Supply-chain check (deny.toml), including the licence allow-list: the
      # 7 outlier licences (Unlicense, BSL-1.0, CC0-1.0, MIT-0, OFL-1.1,
      # Ubuntu-font-1.0, CDLA-Permissive-2.0) were ratified 2026-10-12 (OSS-1.3,
      # conductor/tracks/oss_release_20260717 task 1.3) and are in deny.toml.
      # --all-features so feature-gated deps (fe-webview backends etc.) are checked.
      # The CLI rather than cargo-deny-action, so the report can list advisory IDs.
      - name: Install cargo-deny
        id: deny_install
        continue-on-error: true
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: cargo-deny (advisories, bans, sources, licenses)
        id: deny
        continue-on-error: true
        shell: bash
        run: |
          cargo deny --color never --all-features check advisories bans sources licenses \
            2>&1 | tee "$RUNNER_TEMP/lint-deny.log"

      # Bounded fuzz smoke (thorns_shields FR-3): build both cargo-fuzz targets
      # and run each for 60 s. fuzz/ is its own workspace (excluded from root).
      # The ONE lint finding that is not warn-only: a crash found by the fuzzer
      # (jwt_parse and ed25519_verify are security parsers) sets the job output
      # `fuzz_crash=true`, which blocks `rolling-release` (AC-4). Infrastructure
      # failures -- nightly or cargo-fuzz install, fuzz build, step timeout --
      # stay warnings. Classification: `Fuzz verdict` step below.
      - name: Install nightly toolchain (cargo-fuzz)
        id: fuzz_toolchain
        continue-on-error: true
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        id: fuzz_install
        continue-on-error: true
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      # --target: the prebuilt cargo-fuzz is a static musl binary and defaults to
      # its own triple; ASan cannot link against musl's static libc.
      # LTO off: the workflow-wide thin LTO made the ASan link of the bevy-sized
      # fuzz binary run past the old 30 min timeout (run 38272824101).
      # Build is its own step so a build failure reads as infrastructure, never as a crash.
      - name: Fuzz build
        id: fuzz_build
        continue-on-error: true
        timeout-minutes: 40
        working-directory: fuzz
        shell: bash
        env:
          FUZZ_TARGET_TRIPLE: x86_64-unknown-linux-gnu
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "256"
        run: cargo +nightly fuzz build --target "$FUZZ_TARGET_TRIPLE" 2>&1 | tee "$RUNNER_TEMP/lint-fuzz-build.log"

      # Every target runs even if an earlier one crashed. `rm -rf artifacts`
      # first, so only THIS run's findings can count (the dir is gitignored and
      # not cached; this is belt and braces). -timeout=30 turns a hung input into
      # a libFuzzer `timeout-*` artifact long before the 15 min step cap, which
      # would otherwise kill the run and read as infrastructure. The exit codes
      # are libFuzzer's defaults, pinned so the contract is visible.
      - name: Fuzz run (bounded)
        id: fuzz
        if: steps.fuzz_build.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 15
        working-directory: fuzz
        shell: bash
        env:
          FUZZ_TARGET_TRIPLE: x86_64-unknown-linux-gnu
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "256"
        run: |
          rm -rf artifacts
          failed=0
          for target in jwt_parse ed25519_verify; do
            echo "::group::fuzz $target"
            if ! cargo +nightly fuzz run --target "$FUZZ_TARGET_TRIPLE" "$target" -- \
                -max_total_time=60 -timeout=30 -rss_limit_mb=2048 \
                -error_exitcode=77 -timeout_exitcode=70 \
                2>&1 | tee -a "$RUNNER_TEMP/lint-fuzz.log"; then
              failed=1
            fi
            echo "::endgroup::"
          done
          exit "$failed"

      # Crash = a libFuzzer artifact (crash-/leak-/timeout-/oom-*) under
      # fuzz/artifacts, OR a sanitizer/libFuzzer report line in the run log once
      # libFuzzer had started, OR libFuzzer's error (77) / timeout (70) exit code
      # as cargo-fuzz relays it (or its "Failing input:" line).
      # Anything else that failed (install, build, step timeout) is NOT a crash.
      # Runs on always() so a crash is recorded even if a later step is cut short.
      - name: Fuzz verdict
        id: fuzz_verdict
        if: always()
        shell: bash
        run: |
          set +e
          crash=false
          artifacts=""
          if [ -d fuzz/artifacts ]; then
            artifacts=$(find fuzz/artifacts -type f \( -name 'crash-*' -o -name 'leak-*' -o -name 'timeout-*' -o -name 'oom-*' \) | sort)
          fi
          [ -n "$artifacts" ] && crash=true
          log="$RUNNER_TEMP/lint-fuzz.log"
          report=""
          if [ -f "$log" ]; then
            # Strip ANSI colour first: CARGO_TERM_COLOR=always is set workflow-wide.
            clean=$(sed 's/\x1b\[[0-9;]*m//g' "$log")
            # Only libFuzzer (77/70) and cargo-fuzz ("Failing input:") emit these
            # after a finding, so they count unconditionally.
            finding=$(printf '%s\n' "$clean" | grep -E \
              'Fuzz target exited with exit status: (77|70)|^Failing input:' | sort -u | head -n 10)
            # Sanitizer lines count only once libFuzzer started ("INFO: Seed:" is its
            # first output). An ASan abort before that (shadow-memory/ASLR mapping on
            # the runner) is infrastructure, not a finding.
            sanitizer=$(printf '%s\n' "$clean" | grep -E \
              '==[0-9]+== ?ERROR: |^SUMMARY: (libFuzzer|[A-Za-z]+Sanitizer)' | sort -u | head -n 10)
            if [ -n "$sanitizer" ] && ! printf '%s\n' "$clean" | grep -q 'INFO: Seed:'; then
              echo "::warning title=Fuzz infrastructure::A sanitizer aborted before libFuzzer started; treated as infrastructure, not a crash."
              sanitizer=""
            fi
            report=$(printf '%s\n%s\n' "$finding" "$sanitizer" | sed '/^$/d')
            [ -n "$report" ] && crash=true
          fi
          echo "fuzz_crash=$crash" >> "$GITHUB_OUTPUT"
          if [ "$crash" = true ]; then
            echo "::error title=Fuzzer found a crash::A fuzz target (jwt_parse / ed25519_verify) crashed. This blocks the rolling latest release. The reproducer is uploaded as the fuzz-artifacts artifact."
            {
              echo "## Fuzz found a crash -- rolling release BLOCKED"
              echo
              echo '```'
              echo "${artifacts:-(no artifact file written)}"
              echo "$report"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0

      - name: Upload fuzz reproducers
        if: always() && steps.fuzz_verdict.outputs.fuzz_crash == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore

      # Outcome collector. `always()` so it reports even after a non-lint step
      # failed; it always exits 0 -- lint findings are warnings, never errors.
      - name: Lint report (warnings only)
        if: always()
        shell: bash
        env:
          OUTCOME_FMT: ${{ steps.fmt.outcome }}
          OUTCOME_CLIPPY: ${{ steps.clippy.outcome }}
          OUTCOME_DENY_INSTALL: ${{ steps.deny_install.outcome }}
          OUTCOME_DENY: ${{ steps.deny.outcome }}
          OUTCOME_FUZZ_TOOLCHAIN: ${{ steps.fuzz_toolchain.outcome }}
          OUTCOME_FUZZ_INSTALL: ${{ steps.fuzz_install.outcome }}
          OUTCOME_FUZZ_BUILD: ${{ steps.fuzz_build.outcome }}
          OUTCOME_FUZZ: ${{ steps.fuzz.outcome }}
        run: |
          set +e
          details="$RUNNER_TEMP/lint-details.md"
          : > "$details"
          failed=0
          not_run=0
          {
            echo "## Lint (warn-only)"
            echo
            echo "Lint never fails this run and never blocks build or test. Only a fuzz crash blocks the rolling release."
            echo
            echo "| Check | Result |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          # report <label> <outcome> <log name> <grep -E pattern for the findings excerpt>
          report() {
            local label="$1" outcome="${2:-not run}" log="$RUNNER_TEMP/lint-$3.log" pattern="$4"
            case "$outcome" in
              success)
                echo "| $label | ok |" >> "$GITHUB_STEP_SUMMARY" ;;
              failure)
                failed=$((failed + 1))
                echo "| $label | **FAILED** |" >> "$GITHUB_STEP_SUMMARY"
                # No ':' or ',' in the title: those are property delimiters.
                echo "::warning title=Lint check failed ($label)::$label failed. Warn-only: the run continues. Findings are in the run summary and the step log."
                if [ -n "$pattern" ] && [ -f "$log" ]; then
                  {
                    echo "<details><summary>$label findings (first 40 unique lines)</summary>"
                    echo
                    echo '```'
                    grep -E "$pattern" "$log" | sort -u | head -n 40
                    echo '```'
                    echo
                    echo "</details>"
                    echo
                  } >> "$details"
                fi ;;
              *)
                not_run=$((not_run + 1))
                echo "| $label | $outcome |" >> "$GITHUB_STEP_SUMMARY" ;;
            esac
          }
          report "rustfmt"                  "$OUTCOME_FMT"            fmt    '^Diff in '
          report "clippy -D warnings"       "$OUTCOME_CLIPPY"         clippy '^(error|warning)(\[[a-z0-9_:]+\])?: |^ +--> '
          report "cargo-deny install"       "$OUTCOME_DENY_INSTALL"   none   ''
          report "cargo-deny"               "$OUTCOME_DENY"           deny   '^(error|warning)\[|ID: RUSTSEC-|(advisories|bans|sources|licenses) (ok|FAILED)|rejected: '
          report "nightly toolchain (fuzz)" "$OUTCOME_FUZZ_TOOLCHAIN" none   ''
          report "cargo-fuzz install"       "$OUTCOME_FUZZ_INSTALL"   none   ''
          report "fuzz build"               "$OUTCOME_FUZZ_BUILD"     fuzz-build '^error(\[E[0-9]+\])?: |^ +--> '
          report "fuzz run (bounded)"       "$OUTCOME_FUZZ"           fuzz   'panicked|ERROR: |SUMMARY: |^error'
          if [ "$not_run" -gt 0 ]; then
            echo "::warning title=Lint incomplete::$not_run lint check(s) did not run (an earlier setup step failed or was skipped). See the run summary."
          fi
          {
            echo
            if [ "$failed" -eq 0 ] && [ "$not_run" -eq 0 ]; then
              echo "All lint checks passed."
            else
              echo "$failed lint check(s) failed and $not_run did not run. They are reported as warnings only."
              echo
              cat "$details"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

  linux:
    name: Linux (build + test + package)
    runs-on: ubuntu-latest
    # 150: cold-cache builds (e.g. after a profile change invalidates rust-cache)
    # need ~2h; warm-cache runs finish far under. 90 killed the first thin-LTO run.
    # 180: +headroom for the cold 0.35 fixture generator + store-migration test
    # build. A timeout cancels the job and skips the cache save, so a too-tight
    # cap would keep every later run cold.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      # Bevy 0.18 (x11 + wayland) link-time system libraries, plus the
      # GUI-stack native deps (wry -> webkit2gtk/glib, rfd -> gtk3,
      # keyring -> dbus). See conductor/tracks/cross_platform_desktop_20260429
      # spec "Linux System Dependencies".
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            libdbus-1-dev libssl-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev \
            libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev \
            libgl1-mesa-dev

      - name: Install Rust toolchain
        id: toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          # Share the warm build cache across the build and test steps.
          shared-key: linux-build

      - name: Build release binaries
        run: cargo build --release --bin fractalengine --bin fe-relay

      # Package straight after the build, BEFORE the tests: `cargo test` can
      # relink target/release/fractalengine with dev-dependency features, and
      # users must get the binary `cargo build` produced. The upload below is
      # still gated on the tests passing.
      - name: Package release archives
        shell: bash
        run: |
          mkdir -p package-bin
          cp target/release/fractalengine target/release/fe-relay package-bin/
          strip package-bin/fractalengine package-bin/fe-relay
          python3 scripts/package_release.py --kind gui   --platform linux-x86_64 --binary package-bin/fractalengine --out-dir dist
          python3 scripts/package_release.py --kind relay --platform linux-x86_64 --binary package-bin/fe-relay      --out-dir dist

      # PR test sweep: intentionally scoped to 3 crates (not --workspace) for CI cost.
      # Matches the project's known-green set; expand as coverage grows.
      - name: Test sweep
        env:
          # Env-backed keystore: no OS keychain / Secret Service on runners.
          FE_KEYSTORE_BACKEND: env
        run: cargo test --release -p fe-ui -p fe-terrain -p fractalengine

      # iroh 0.35 -> 1.x store-migration proof (fe-sync/src/AGENTS.md
      # §store-migration). The 0.35 fixture is never committed: a real
      # iroh 0.35 build writes it here, then the migration tests run with
      # FE_REQUIRE_STORE_FIXTURE=1, so a missing fixture FAILS instead of skipping.
      # The generator is its own workspace. Its target dir is cached with plain
      # actions/cache: a second rust-cache would prune the shared
      # ~/.cargo/registry down to its own crates before the main cache saves.
      - name: Cache 0.35 fixture generator target
        uses: actions/cache@v4
        with:
          path: fe-sync/tests/fixtures/p2p_store_v035_gen/target
          key: v035-fixture-gen-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('fe-sync/tests/fixtures/p2p_store_v035_gen/Cargo.lock') }}

      - name: Generate iroh 0.35 store fixture
        timeout-minutes: 30
        working-directory: fe-sync/tests/fixtures/p2p_store_v035_gen
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_INCREMENTAL: "0"
        run: cargo run --locked -- ../p2p_store_v035

      # Same -p set as the sweep (+ fe-sync): cargo unifies features across the
      # selected packages, so this resolves exactly like the sweep and reuses
      # its release build. --lib plus the name filter runs only the migration tests.
      # The grep fails the step if the fixture test did not run and pass (a
      # renamed or cfg'd-out test would otherwise match zero tests and go green).
      - name: Store-migration test (0.35 fixture required)
        timeout-minutes: 45
        shell: bash
        env:
          FE_REQUIRE_STORE_FIXTURE: "1"
        run: |
          cargo test --release -p fe-ui -p fe-terrain -p fractalengine -p fe-sync --lib p2p_store_migration \
            -- --color never 2>&1 | tee "$RUNNER_TEMP/store-migration-test.log"
          grep -q 'p2p_store_migration::tests::legacy_v035_fixture_migrates_and_reads_back \.\.\. ok' \
            "$RUNNER_TEMP/store-migration-test.log"

      # One artifact per platform holding both archives. The .tar.gz keeps the
      # binary's executable bit (upload-artifact drops Unix modes on loose files).
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: package-linux-x86_64
          path: dist/*
          if-no-files-found: error

  windows:
    name: Windows (build + package)
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-build

      - name: Build release binaries
        run: cargo build --release --bin fractalengine --bin fe-relay

      # Pin the interpreter the packaging script runs on rather than relying on
      # whatever `python` Git Bash happens to find on the runner PATH.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # bash (Git Bash) rather than pwsh: pwsh only checks the LAST native
      # exit code, so a failed first packaging call would go unnoticed.
      - name: Package release archives
        shell: bash
        run: |
          python scripts/package_release.py --kind gui   --platform windows-x86_64 --binary target/release/fractalengine.exe --out-dir dist
          python scripts/package_release.py --kind relay --platform windows-x86_64 --binary target/release/fe-relay.exe      --out-dir dist

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: package-windows-x86_64
          path: dist/*
          if-no-files-found: error

  # macOS (build + test + artifacts) was REMOVED 2026-08-19 at the owner's
  # direction. It had not completed since 2026-07-27: the job hit its timeout
  # during the test sweep, a timeout cancels the job, and a cancelled job skips
  # the rust-cache post step -- so the cache never saved and every run restarted
  # cold into the same wall. macos-latest also bills at ~10x. Restore from git
  # history (see the commit that removed this) if macOS coverage is wanted again.

  # D-CI3: the rolling `latest` prerelease -- a public, login-free download
  # channel that tracks the newest commit on `main` whose BUILD + TEST jobs
  # passed (lint is warn-only; only a fuzz-found crash holds it back -- AC-4).
  # `release.yml` stays the stable, version-tagged line; this is the bleeding edge.
  #
  # Why this job exists at all: the `actions/upload-artifact` uploads above
  # require a GitHub login to download and expire after 90 days, so they cannot
  # serve as a public download. A Release asset can.
  #
  # DOWNLOAD URL -- note the shape, it is not the obvious one:
  #   .../releases/download/latest/fractalengine-windows-x86_64.zip
  # NOT `.../releases/latest/download/...`. GitHub computes "latest release" as
  # the newest release that is *not* a prerelease, so a prerelease is
  # unreachable through `/releases/latest/`. The tag is literally named
  # `latest`, so the tag-addressed form above is stable and always correct --
  # and it leaves the "Latest" badge free for the real `v*` releases.
  rolling-release:
    name: Publish rolling `latest` prerelease
    runs-on: ubuntu-latest
    # `!cancelled()` replaces the implicit success() check, so the explicit
    # conditions below are the whole gate: both build jobs succeeded AND lint
    # did not report a fuzz crash (AC-4). Lint's own result is deliberately NOT
    # checked -- every other lint finding is warn-only. A cancelled/skipped lint
    # job leaves the output empty, which counts as "no crash" (warned below).
    needs: [lint, linux, windows]
    # `main` only -- a PR run must never move the public rolling channel.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.linux.result == 'success' && needs.windows.result == 'success' && needs.lint.outputs.fuzz_crash != 'true' }}
    permissions:
      # An explicit `permissions:` block zeroes every scope it omits, so
      # `actions: read` has to be restated for download-artifact.
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # This job deliberately does not check out the repo, so `gh` has no git
      # remote to infer from -- GH_REPO is what makes every `gh` call below work.
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Fuzz gate (lint verdict)
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          FUZZ_CRASH: ${{ needs.lint.outputs.fuzz_crash }}
        run: |
          echo "lint result: $LINT_RESULT, fuzz_crash: '${FUZZ_CRASH}'"
          case "$LINT_RESULT" in
            cancelled|skipped)
              echo "::warning title=Fuzz gate unverified::The lint job was $LINT_RESULT, so no fuzz verdict exists. Publishing as no-crash." ;;
            *)
              if [ -z "$FUZZ_CRASH" ]; then
                echo "::warning title=Fuzz gate unverified::The lint job produced no fuzz verdict. Publishing as no-crash."
              fi ;;
          esac

      - name: Download this run's packages
        uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true
          path: dist

      # Fail loudly if a package is missing rather than publishing a partial set.
      - name: Check packages + write SHA256SUMS
        run: |
          cd dist
          for f in fractalengine-windows-x86_64.zip fractalengine-linux-x86_64.tar.gz \
                   fe-relay-windows-x86_64.zip fe-relay-linux-x86_64.tar.gz; do
            [ -f "$f" ] || { echo "::error::missing package $f"; exit 1; }
          done
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Write release notes
        run: |
          {
            echo "Rolling build of \`main\` -- **not a stable release.** This release is"
            echo "republished and its assets replaced on every commit whose Linux and"
            echo "Windows build jobs pass. For a supported build, use the newest \`v*\` release."
            echo
            echo "| Download | Platform | What |"
            echo "|---|---|---|"
            echo "| \`fractalengine-windows-x86_64.zip\` | Windows x86_64 | Desktop app |"
            echo "| \`fractalengine-linux-x86_64.tar.gz\` | Linux x86_64 (glibc 2.39+) | Desktop app |"
            echo "| \`fe-relay-windows-x86_64.zip\` | Windows x86_64 | Headless relay |"
            echo "| \`fe-relay-linux-x86_64.tar.gz\` | Linux x86_64 (glibc 2.39+) | Headless relay |"
            echo "| \`SHA256SUMS\` | -- | Checksums |"
            echo
            echo "Extract the whole archive and read \`QUICKSTART.txt\` inside it. Keep the"
            echo "\`assets\` folder next to the program: the app keeps its \`data\` folder there."
            echo "Verify downloads with \`sha256sum -c SHA256SUMS --ignore-missing\`."
            echo
            echo "Built from \`${GITHUB_SHA}\` by [run ${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})."
          } > NOTES.md

      # A rolling tag must be FORCE-moved. `gh release create` only creates a tag
      # that does not already exist, so without this step the `latest` release
      # would go on pointing at whichever commit first published it.
      - name: Force-move the `latest` tag to this commit
        run: |
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/latest" \
               -f sha="${GITHUB_SHA}" -F force=true \
            || gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
               -f ref="refs/tags/latest" -f sha="${GITHUB_SHA}"

      # Create on the first run, overwrite on every run after -- the whole point
      # of a rolling channel, and the half that a create-only action gets wrong.
      # `--clobber` replaces same-named assets instead of failing on them.
      - name: Publish / overwrite the `latest` prerelease
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --prerelease \
              --title "Rolling build (latest)" --notes-file NOTES.md
            gh release upload latest dist/* --clobber
          else
            gh release create latest --prerelease --target "${GITHUB_SHA}" \
              --title "Rolling build (latest)" --notes-file NOTES.md \
              dist/*
          fi

      # Upload first, prune second, so the release is never empty. This removes
      # assets this run did not produce -- e.g. the bare binaries published
      # before 2026-10-13 -- so no stale download lingers next to the archives.
      - name: Remove stale assets
        run: |
          gh release view latest --json assets --jq '.assets[].name' | while read -r name; do
            if [ ! -e "dist/$name" ]; then
              echo "removing stale asset $name"
              gh release delete-asset latest "$name" --yes
            fi
          done
          gh release view latest --json tagName,isPrerelease,assets \
            --jq '{tag: .tagName, prerelease: .isPrerelease, assets: [.assets[].name]}'
