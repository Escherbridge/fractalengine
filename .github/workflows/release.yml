name: Release

# Tag-triggered release pipeline (release_ci_20260429, plan Tasks 2.1-2.3, 2.6).
# Builds the Linux and Windows artifact matrix, packages each binary as a
# user-facing archive (.zip on Windows, .tar.gz elsewhere: binary + runtime
# assets + QUICKSTART.txt + licences -- scripts/package_release.py, the same
# packaging as the rolling build in build-artifacts.yml), publishes a GitHub
# Release with a SHA256SUMS manifest (minisign-signed when MINISIGN_SECRET_KEY is set,
# notes rendered from .github/release-notes-template.md), and pushes the relay Docker image to GHCR. Tags containing '-' (e.g. v0.3.0-rc1) publish as
# pre-releases. `workflow_dispatch` runs the builds without publishing.

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always
  # surrealdb-core needs deep compile-time recursion stacks; harmless elsewhere.
  RUST_MIN_STACK: "134217728"
  # Fat LTO + codegen-units=1 (workspace release profile) OOMs hosted runners
  # on the Bevy binary link (see build-artifacts run 29440668419). Thin LTO
  # for CI-built release artifacts; revisit with larger runners.
  CARGO_PROFILE_RELEASE_LTO: thin
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"

jobs:
  linux-x86_64:
    name: Linux x86_64 (GUI + relay)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      # Full GUI-stack deps: Bevy (x11/wayland/alsa/udev) + wry/rfd/keyring
      # (webkit2gtk/gtk3/glib/dbus). Mirrors build-artifacts.yml.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            libdbus-1-dev libssl-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev \
            libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev \
            libgl1-mesa-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-linux-x86_64

      - name: Build release binaries
        run: cargo build --release --bin fractalengine --bin fe-relay

      - name: Package artifacts
        shell: bash
        run: |
          mkdir -p package-bin
          cp target/release/fractalengine target/release/fe-relay package-bin/
          strip package-bin/fractalengine package-bin/fe-relay
          python3 scripts/package_release.py --kind gui   --platform linux-x86_64 --binary package-bin/fractalengine --out-dir dist
          python3 scripts/package_release.py --kind relay --platform linux-x86_64 --binary package-bin/fe-relay      --out-dir dist

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: dist/*
          if-no-files-found: error

  windows-x86_64:
    name: Windows x86_64 (GUI + relay)
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      # Optional Authenticode signing (docs/release-signing.md); secrets cannot be read in `if:`.
      SIGNING_CONFIGURED: ${{ secrets.AZURE_TENANT_ID != '' }}
    outputs:
      signed: ${{ env.SIGNING_CONFIGURED }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-windows-x86_64

      - name: Build release binaries
        run: cargo build --release --bin fractalengine --bin fe-relay

      # Between build and packaging so SHA256SUMS cover signed files. To change
      # provider (SignPath, signtool + cloud HSM) replace ONLY the "Sign" step.
      - name: Sign Windows binaries (Azure Trusted Signing)
        if: env.SIGNING_CONFIGURED == 'true'
        uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files-folder: target/release
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify Authenticode signatures
        if: env.SIGNING_CONFIGURED == 'true'
        shell: pwsh
        run: |
          foreach ($exe in 'target/release/fractalengine.exe', 'target/release/fe-relay.exe') {
            $sig = Get-AuthenticodeSignature $exe
            Write-Host "$exe : $($sig.Status)"
            if ($sig.Status -ne 'Valid') { throw "$exe is not validly signed ($($sig.Status))" }
          }

      - name: Note unsigned Windows binaries
        if: env.SIGNING_CONFIGURED != 'true'
        shell: bash
        run: echo "::notice title=Unsigned Windows binaries::Signing is not configured; the Windows binaries are unsigned and SmartScreen will warn. See docs/release-signing.md."

      # Pin the interpreter the packaging script runs on rather than relying on
      # whatever `python` Git Bash happens to find on the runner PATH.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # bash, not pwsh: pwsh only checks the LAST native exit code.
      - name: Package artifacts
        shell: bash
        run: |
          python scripts/package_release.py --kind gui   --platform windows-x86_64 --binary target/release/fractalengine.exe --out-dir dist
          python scripts/package_release.py --kind relay --platform windows-x86_64 --binary target/release/fe-relay.exe      --out-dir dist

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: dist/*
          if-no-files-found: error

  windows-arm64:
    name: Windows ARM64 (GUI, MSVC cross)
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      SIGNING_CONFIGURED: ${{ secrets.AZURE_TENANT_ID != '' }}
    outputs:
      signed: ${{ env.SIGNING_CONFIGURED }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: aarch64-pc-windows-msvc

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-windows-arm64

      - name: Build release binary
        run: cargo build --release --target aarch64-pc-windows-msvc --bin fractalengine

      # Same provider-swappable signing step as windows-x86_64 above.
      - name: Sign Windows binaries (Azure Trusted Signing)
        if: env.SIGNING_CONFIGURED == 'true'
        uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files-folder: target/aarch64-pc-windows-msvc/release
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify Authenticode signatures
        if: env.SIGNING_CONFIGURED == 'true'
        shell: pwsh
        run: |
          $exe = 'target/aarch64-pc-windows-msvc/release/fractalengine.exe'
          $sig = Get-AuthenticodeSignature $exe
          Write-Host "$exe : $($sig.Status)"
          if ($sig.Status -ne 'Valid') { throw "$exe is not validly signed ($($sig.Status))" }

      - name: Note unsigned Windows binaries
        if: env.SIGNING_CONFIGURED != 'true'
        shell: bash
        run: echo "::notice title=Unsigned Windows binaries::Signing is not configured; the Windows binaries are unsigned and SmartScreen will warn. See docs/release-signing.md."

      # Pin the interpreter the packaging script runs on rather than relying on
      # whatever `python` Git Bash happens to find on the runner PATH.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Package artifacts
        shell: bash
        run: |
          python scripts/package_release.py --kind gui --platform windows-aarch64 \
            --binary target/aarch64-pc-windows-msvc/release/fractalengine.exe --out-dir dist

      - uses: actions/upload-artifact@v4
        with:
          name: windows-arm64
          path: dist/*
          if-no-files-found: error

  # macOS GUI matrix and the lipo universal-binary job were REMOVED 2026-08-19
  # at the owner's direction; see the build-artifacts.yml note. Restore from git
  # history if macOS artifacts are wanted again.

  # Static musl relay binaries via cargo-zigbuild (no glibc dependency).
  musl-relay:
    name: Relay musl ${{ matrix.arch }} (zigbuild)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-musl
          - arch: aarch64
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: ${{ matrix.target }}

      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Install zig
        uses: mlugg/setup-zig@v2

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-musl-${{ matrix.arch }}

      - name: Build relay
        run: cargo zigbuild --release --target ${{ matrix.target }} -p fractalengine-relay

      - name: Package artifacts
        shell: bash
        run: |
          python3 scripts/package_release.py --kind relay --platform linux-musl-${{ matrix.arch }} \
            --binary target/${{ matrix.target }}/release/fe-relay --out-dir dist

      - uses: actions/upload-artifact@v4
        with:
          name: musl-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  # Task 2.6 / FR-4: relay image to GHCR. Tag = release tag; `latest` only on
  # stable (non-prerelease) tags.
  docker-relay:
    name: Docker relay image (GHCR)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/fractalengine-relay
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.relay
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Task 2.2: collect every artifact, emit SHA256SUMS, publish the release.
  # Tasks 3.2-3.4: minisign SHA256SUMS (covers every archive) and render the notes
  # from .github/release-notes-template.md (docs/release-signing.md).
  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - linux-x86_64
      - windows-x86_64
      - windows-arm64
      - musl-relay
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    env:
      # Optional checksum signing (docs/release-signing.md); secrets cannot be read in `if:`.
      MINISIGN_CONFIGURED: ${{ secrets.MINISIGN_SECRET_KEY != '' }}
    steps:
      # Needed for the notes template and the committed public key.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: release-assets

      # Fail loudly if a package is missing rather than publishing a partial set.
      - name: Check packages + generate SHA256SUMS
        run: |
          cd release-assets
          for f in fractalengine-linux-x86_64.tar.gz fe-relay-linux-x86_64.tar.gz \
                   fractalengine-windows-x86_64.zip fe-relay-windows-x86_64.zip \
                   fractalengine-windows-aarch64.zip \
                   fe-relay-linux-musl-x86_64.tar.gz fe-relay-linux-musl-aarch64.tar.gz; do
            [ -f "$f" ] || { echo "::error::missing package $f"; exit 1; }
          done
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      # Task 3.2/3.3: one detached signature over SHA256SUMS covers every archive.
      # The key lives only under $RUNNER_TEMP, never in release-assets/ (uploaded wholesale).
      - name: Sign SHA256SUMS (minisign)
        if: env.MINISIGN_CONFIGURED == 'true'
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends minisign
          key_file="$RUNNER_TEMP/minisign.key"
          ( umask 077; printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key_file" )
          chmod 600 "$key_file"
          # Passwordless keys (minisign -G -W) never prompt; an optional password is fed on stdin.
          printf '%s\n' "${MINISIGN_PASSWORD:-}" | minisign -S -s "$key_file" \
            -m release-assets/SHA256SUMS -x release-assets/SHA256SUMS.minisig \
            -t "fractalengine $TAG SHA256SUMS"

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/minisign.key"

      # A committed public key with no secret is a lost or expired secret: warn, still publish.
      - name: Note unsigned checksums
        if: env.MINISIGN_CONFIGURED != 'true'
        env:
          PUBLIC_KEY_COMMITTED: ${{ hashFiles('docs/release-signing.pub') != '' }}
        run: |
          if [ "$PUBLIC_KEY_COMMITTED" = "true" ]; then
            echo "::warning::SHA256SUMS is unsigned although docs/release-signing.pub is committed (MINISIGN_SECRET_KEY not set)"
          else
            echo "::notice::SHA256SUMS is unsigned (MINISIGN_SECRET_KEY not set)"
          fi

      # Catches a secret key that does not match the committed public key before publishing.
      - name: Verify SHA256SUMS signature
        if: env.MINISIGN_CONFIGURED == 'true' && hashFiles('docs/release-signing.pub') != ''
        run: minisign -V -p docs/release-signing.pub -m release-assets/SHA256SUMS -x release-assets/SHA256SUMS.minisig

      # Task 3.4: values arrive through env (never interpolated into the script) and are
      # escaped for the sed replacement.
      - name: Render release notes
        env:
          TAG: ${{ github.ref_name }}
          OWNER: ${{ github.repository_owner }}
          REPOSITORY: ${{ github.repository }}
          WINDOWS_SIGNED: "${{ needs.windows-x86_64.outputs.signed == 'true' && needs.windows-arm64.outputs.signed == 'true' && 'yes (Authenticode)' || 'no (SmartScreen will warn: More info, then Run anyway)' }}"
          CHECKSUMS_SIGNED: ${{ env.MINISIGN_CONFIGURED == 'true' && 'yes (minisign, SHA256SUMS.minisig)' || 'no' }}
        run: |
          set -euo pipefail
          escape() { printf '%s' "$1" | sed -e 's/[\\&|]/\\&/g'; }
          notes="$RUNNER_TEMP/release-notes.md"
          sed -e "s|{{TAG}}|$(escape "$TAG")|g" \
              -e "s|{{OWNER}}|$(escape "$OWNER")|g" \
              -e "s|{{REPOSITORY}}|$(escape "$REPOSITORY")|g" \
              -e "s|{{WINDOWS_SIGNED}}|$(escape "$WINDOWS_SIGNED")|g" \
              -e "s|{{CHECKSUMS_SIGNED}}|$(escape "$CHECKSUMS_SIGNED")|g" \
              .github/release-notes-template.md > "$notes"
          if grep -n '{{[A-Z_]*}}' "$notes"; then
            echo "::error::unrendered placeholder in release notes"; exit 1
          fi
          cat "$notes"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: ${{ runner.temp }}/release-notes.md
