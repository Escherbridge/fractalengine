name: Release

# Tag-triggered release pipeline (release_ci_20260429, plan Tasks 2.1-2.3, 2.6).
# Builds the Linux and Windows artifact matrix, packages each binary as a
# user-facing archive (.zip on Windows, .tar.gz elsewhere: binary + runtime
# assets + QUICKSTART.txt + licences -- scripts/package_release.py, the same
# packaging as the rolling build in build-artifacts.yml), publishes a GitHub
# Release with a SHA256SUMS manifest, and pushes the relay Docker image to GHCR. Tags containing '-' (e.g. v0.3.0-rc1) publish as
# pre-releases. `workflow_dispatch` runs the builds without publishing.

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always
  # surrealdb-core needs deep compile-time recursion stacks; harmless elsewhere.
  RUST_MIN_STACK: "134217728"
  # Fat LTO + codegen-units=1 (workspace release profile) OOMs hosted runners
  # on the Bevy binary link (see build-artifacts run 29440668419). Thin LTO
  # for CI-built release artifacts; revisit with larger runners.
  CARGO_PROFILE_RELEASE_LTO: thin
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"

jobs:
  linux-x86_64:
    name: Linux x86_64 (GUI + relay)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      # Full GUI-stack deps: Bevy (x11/wayland/alsa/udev) + wry/rfd/keyring
      # (webkit2gtk/gtk3/glib/dbus). Mirrors build-artifacts.yml.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            libdbus-1-dev libssl-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev \
            libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev \
            libgl1-mesa-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-linux-x86_64

      - name: Build release binaries
        run: cargo build --release --bin fractalengine --bin fe-relay

      - name: Package artifacts
        shell: bash
        run: |
          mkdir -p package-bin
          cp target/release/fractalengine target/release/fe-relay package-bin/
          strip package-bin/fractalengine package-bin/fe-relay
          python3 scripts/package_release.py --kind gui   --platform linux-x86_64 --binary package-bin/fractalengine --out-dir dist
          python3 scripts/package_release.py --kind relay --platform linux-x86_64 --binary package-bin/fe-relay      --out-dir dist

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: dist/*
          if-no-files-found: error

  windows-x86_64:
    name: Windows x86_64 (GUI + relay)
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-windows-x86_64

      - name: Build release binaries
        run: cargo build --release --bin fractalengine --bin fe-relay

      # Pin the interpreter the packaging script runs on rather than relying on
      # whatever `python` Git Bash happens to find on the runner PATH.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # bash, not pwsh: pwsh only checks the LAST native exit code.
      - name: Package artifacts
        shell: bash
        run: |
          python scripts/package_release.py --kind gui   --platform windows-x86_64 --binary target/release/fractalengine.exe --out-dir dist
          python scripts/package_release.py --kind relay --platform windows-x86_64 --binary target/release/fe-relay.exe      --out-dir dist

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: dist/*
          if-no-files-found: error

  windows-arm64:
    name: Windows ARM64 (GUI, MSVC cross)
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-windows-arm64

      - name: Build release binary
        run: cargo build --release --target aarch64-pc-windows-msvc --bin fractalengine

      # Pin the interpreter the packaging script runs on rather than relying on
      # whatever `python` Git Bash happens to find on the runner PATH.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Package artifacts
        shell: bash
        run: |
          python scripts/package_release.py --kind gui --platform windows-aarch64 \
            --binary target/aarch64-pc-windows-msvc/release/fractalengine.exe --out-dir dist

      - uses: actions/upload-artifact@v4
        with:
          name: windows-arm64
          path: dist/*
          if-no-files-found: error

  # macOS GUI matrix and the lipo universal-binary job were REMOVED 2026-08-19
  # at the owner's direction; see the build-artifacts.yml note. Restore from git
  # history if macOS artifacts are wanted again.

  # Static musl relay binaries via cargo-zigbuild (no glibc dependency).
  musl-relay:
    name: Relay musl ${{ matrix.arch }} (zigbuild)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-musl
          - arch: aarch64
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Install zig
        uses: mlugg/setup-zig@v2

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-musl-${{ matrix.arch }}

      - name: Build relay
        run: cargo zigbuild --release --target ${{ matrix.target }} -p fractalengine-relay

      - name: Package artifacts
        shell: bash
        run: |
          python3 scripts/package_release.py --kind relay --platform linux-musl-${{ matrix.arch }} \
            --binary target/${{ matrix.target }}/release/fe-relay --out-dir dist

      - uses: actions/upload-artifact@v4
        with:
          name: musl-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  # Task 2.6 / FR-4: relay image to GHCR. Tag = release tag; `latest` only on
  # stable (non-prerelease) tags.
  docker-relay:
    name: Docker relay image (GHCR)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/fractalengine-relay
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.relay
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Task 2.2: collect every artifact, emit SHA256SUMS, publish the release.
  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - linux-x86_64
      - windows-x86_64
      - windows-arm64
      - musl-relay
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: release-assets

      # Fail loudly if a package is missing rather than publishing a partial set.
      - name: Check packages + generate SHA256SUMS
        run: |
          cd release-assets
          for f in fractalengine-linux-x86_64.tar.gz fe-relay-linux-x86_64.tar.gz \
                   fractalengine-windows-x86_64.zip fe-relay-windows-x86_64.zip \
                   fractalengine-windows-aarch64.zip \
                   fe-relay-linux-musl-x86_64.tar.gz fe-relay-linux-musl-aarch64.tar.gz; do
            [ -f "$f" ] || { echo "::error::missing package $f"; exit 1; }
          done
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            ## Downloads

            | Download | Platform | What |
            |----------|----------|------|
            | `fractalengine-windows-x86_64.zip` | Windows x86_64 | Desktop app |
            | `fractalengine-windows-aarch64.zip` | Windows ARM64 | Desktop app |
            | `fractalengine-linux-x86_64.tar.gz` | Linux x86_64 (glibc 2.39+) | Desktop app |
            | `fe-relay-windows-x86_64.zip` | Windows x86_64 | Headless relay |
            | `fe-relay-linux-x86_64.tar.gz` | Linux x86_64 (glibc 2.39+) | Headless relay |
            | `fe-relay-linux-musl-x86_64.tar.gz` | Linux x86_64 (static musl) | Headless relay |
            | `fe-relay-linux-musl-aarch64.tar.gz` | Linux ARM64 (static musl) | Headless relay |
            | `SHA256SUMS` | — | Checksums |

            Extract the whole archive and read `QUICKSTART.txt` inside it. Keep the
            `assets` folder next to the desktop app: the app keeps its `data` folder there.
            Verify downloads with `sha256sum -c SHA256SUMS --ignore-missing`.

            Docker: `docker pull ghcr.io/${{ github.repository_owner }}/fractalengine-relay:${{ github.ref_name }}`
