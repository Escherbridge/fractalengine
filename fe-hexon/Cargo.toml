[package]
name = "fe-hexon"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Hexon package format tooling — registry, packaging, publishing"

[features]
remote = ["dep:reqwest"]
# Partial-fetch conformance suite (`partial::conformance::run`) for transport crates' tests.
conformance = []

[dependencies]
fe-runtime = { path = "../fe-runtime" }
fe-identity = { path = "../fe-identity" }
fe-policy = { path = "../fe-policy" }
fe-format = { path = "../fe-format", features = ["entitlement"] }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
zip = "0.6"
blake3 = { workspace = true }
ed25519-dalek = { workspace = true }
tokio = { workspace = true }
async-trait = "0.1"
bytes = { workspace = true }
tracing = { workspace = true }
base64 = "0.22"
multibase = "0.9"
rand = "0.8"
crossbeam = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }
ulid = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
dirs = "5"

# Optional (feature `remote`)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"], optional = true }

[dev-dependencies]
fe-terrain = { path = "../fe-terrain" }
fe-hexon-registry = { path = "../fe-hexon-registry" }
# PAS-P5 S5 P2P partial-fetch tests: real iroh loopback stacks + the P3P4 seeding path.
fe-sync = { path = "../fe-sync" }
iroh = { workspace = true }
axum = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
tempfile = "3"
