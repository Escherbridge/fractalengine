[workspace]

[package]
name = "iot-bridge"
version = "0.1.0"
edition = "2021"
description = "Vertical-slice extension proving IoT device <-> node interop over the HOST-FN CONTRACT"

[dependencies]
fe-sdk = { path = "../../fe-sdk" }
rhai = "1.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# tests/bridge_loop.rs drives iot_bridge.rhai through fe-plugin-test's shared
# RhaiTestRunner host-fn surface (the real HOST-FN CONTRACT). src/ keeps its own
# capability-gated IotHostAdapter for the runtime path — see AGENTS.md "Integration".
fe-plugin-test = { path = "../../fe-plugin-test" }
