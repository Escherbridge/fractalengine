[package]
name = "fe-api"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "HTTP/WebSocket API gateway for FractalEngine"

[dependencies]
fe-runtime = { path = "../fe-runtime" }
fe-identity = { path = "../fe-identity" }
fe-database = { path = "../fe-database" }
fe-format = { path = "../fe-format" }
fe-query = { path = "../fe-query", features = ["datafusion"] }
fe-entity-store = { path = "../fe-entity-store" }
fe-terrain = { path = "../fe-terrain" }
fe-hexon = { path = "../fe-hexon" }
fe-policy = { path = "../fe-policy" }
axum-extra = { version = "0.10", features = ["multipart"] }
axum = { workspace = true }
tokio = { workspace = true }
tower-http = { workspace = true }
crossbeam = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
ulid = { workspace = true }
ed25519-dalek = { workspace = true }
surrealdb = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }
# Share-token encoding (already in-tree via jsonwebtoken's dep graph)
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
blake3 = { workspace = true }
hex = "0.4"
# Dev-dep cycle is legal cargo: the API-integration harness lives in the
# harness crate's lib target (see fe-test-harness/src/AGENTS.md §api-harness).
fractalengine-test-harness = { path = "../fe-test-harness" }


