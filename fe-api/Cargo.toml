[package]
name = "fe-api"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "HTTP/WebSocket API gateway for FractalEngine"

[dependencies]
fe-runtime = { path = "../fe-runtime" }
fe-identity = { path = "../fe-identity" }
fe-database = { path = "../fe-database" }
fe-format = { path = "../fe-format" }
fe-query = { path = "../fe-query", features = ["datafusion"] }
fe-entity-store = { path = "../fe-entity-store" }
fe-terrain = { path = "../fe-terrain" }
fe-hexon = { path = "../fe-hexon" }
fe-policy = { path = "../fe-policy" }
# SPEC-7 commit/preview wire protocol (canonical_ws module, unmounted — see
# fe-api/src/canonical_ws/AGENTS.md).
fe-canonical-log = { path = "../fe-canonical-log" }
axum-extra = { version = "0.10", features = ["multipart"] }
axum = { workspace = true }
tokio = { workspace = true }
tower-http = { workspace = true }
crossbeam = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
ulid = { workspace = true }
ed25519-dalek = { workspace = true }
surrealdb = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }
# Share-token encoding (already in-tree via jsonwebtoken's dep graph)
base64 = "0.22"
# Strong ETag over export/share bodies (DEC-C18).
blake3 = { workspace = true }

[dev-dependencies]
tempfile = "3"
hex = "0.4"
# Dev-dep cycle is legal cargo: the API-integration harness lives in the
# harness crate's lib target (see fe-test-harness/src/AGENTS.md §api-harness).
fractalengine-test-harness = { path = "../fe-test-harness" }
# Router-nesting shape test (canonical_ws::router) — same pattern and version as
# fe-test-harness/src/api.rs's ApiHarness::request.
tower = { version = "0.5", features = ["util"] }
# Live `/ws` handshake test (ws_integration.rs — F14/T1): a real client over a
# bound TcpListener, since `tower::oneshot` cannot perform a WS upgrade.
# Already in the dep graph at this exact version via axum 0.8's own `ws`
# feature (see Cargo.lock) — this adds no new compile unit, just a dev-only
# path to it.
tokio-tungstenite = "0.29"
futures-util = "0.3"


