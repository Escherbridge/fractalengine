[package]
name = "fe-plugin"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Plugin engines (Rhai and Wasmtime) with sandboxing and lifecycle"

[dependencies]
fe-runtime = { path = "../fe-runtime" }
fe-sdk = { path = "../fe-sdk" }
fe-policy = { path = "../fe-policy" }
rhai = "1.24"
wasmtime = { version = "49.0.2", features = ["async"] }
blake3 = { workspace = true }
anyhow = { workspace = true }
crossbeam = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
bevy = { workspace = true }
thiserror = { workspace = true }
ulid = { workspace = true }
ed25519-dalek = { workspace = true }
hex = "0.4"
# trusted_publishers.toml (trust_roots.rs); 0.8 is the line already in Cargo.lock.
toml = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
# Archive + licence types only. Add the `entitlement` feature once hexon_entitlements_20261031 S1
# lands it; until then licensed packages are refused (src/AGENTS.md §registry-install).
fe-format = { path = "../fe-format", default-features = false }

[dev-dependencies]
fe-plugin-test = { path = "../fe-plugin-test" }
tokio = { workspace = true }
tempfile = "3"
wat = "1"
