[package]
name = "fe-plugin"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Plugin engines (Rhai and Wasmtime) with sandboxing and lifecycle"

[dependencies]
fe-runtime = { path = "../fe-runtime" }
fe-sdk = { path = "../fe-sdk" }
fe-policy = { path = "../fe-policy" }
rhai = "1.19"
wasmtime = { version = "49.0.2", features = ["async"] }
blake3 = { workspace = true }
anyhow = { workspace = true }
crossbeam = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
bevy = { workspace = true }
thiserror = { workspace = true }
ulid = { workspace = true }
ed25519-dalek = { workspace = true }
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
# `entitlement` carries EntitlementVerifier (landed by hexon_entitlements_20261031).
fe-format = { path = "../fe-format", default-features = false, features = ["entitlement"] }

[dev-dependencies]
fe-plugin-test = { path = "../fe-plugin-test" }
tokio = { workspace = true }
tempfile = "3"
wat = "1"
