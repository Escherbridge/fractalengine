[workspace]
members = [
    "fractalengine",
    "fe-runtime",
    "fe-network",
    "fe-database",
    "fe-identity",
    "fe-renderer",
    "fe-webview",
    "fe-sync",
    "fe-ui",
    "fe-test-harness",
    "fe-api",
    "fractalengine-relay",
    "fe-format",
    "fe-entity-store",
    "fe-query",
    "fe-terrain",
    "fe-hexon",
    "fe-hexon-registry",
    "fe-plugin",
    "fe-plugin-test",
    "fe-sdk",
    "fe-policy",
    "fe-canonical-log",
    # Simulation lab (M3): sim-only crate — no production crate depends on
    # it, so the prod path gains nothing (D3's "no new prod-path deps").
    # Sole exception: fractalengine-relay's default-OFF `sim-control`
    # feature (F9/A20) — default builds never compile it.
    "fe-sim",
]
# cargo-fuzz targets are their own workspace (nightly + libFuzzer); see fuzz/Cargo.toml.
exclude = ["fuzz"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Escherbridge/fractalengine"
rust-version = "1.91"

[workspace.dependencies]
bevy = { version = "0.18", default-features = false, features = [
    # 3D rendering pipeline (PBR, GLTF, gizmos, anti-alias, post-process)
    "3d_bevy_render",
    # App fundamentals (asset, state, window, logging, input focus)
    "default_app",
    # UI rendering (bevy_ui + render backend)
    "ui_bevy_render",
    # Scene serialization
    "scene",
    # Picking (mesh, sprite, UI)
    "bevy_picking", "mesh_picking", "sprite_picking", "ui_picking",
    # Platform (windowing, threading, fonts)
    "std", "bevy_winit", "default_font", "multi_threaded",
    # Linux display servers
    "x11", "wayland",
    # Diagnostics
    "sysinfo_plugin",
] }

bevy_egui = "0.39"
crossbeam = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
surrealdb = { version = "3.0", features = ["kv-surrealkv", "kv-mem"] }
libp2p = { version = "0.56", features = ["kad", "quic", "tokio", "macros"] }
# iroh 1.x stack (pin "1.3": every v1 minor is wire-compatible; 1.2+ needed for
# RelayStatus::auth_denied_reason). 0.35 <-> 1.x peers cannot interoperate —
# flag-day upgrade; see fe-sync/src/AGENTS.md §iroh-1.x.
iroh = "1.3"
# 0.103.0 was yanked — pin the patch release.
iroh-blobs = "0.103.1"
iroh-gossip = "0.101"
# Default features carry `rpc` (DocsApi), `fs-store` and `redb-v2-migration`
# (tuple-table rewrite on first open of a 0.35 store) — never set
# default-features = false without re-adding them.
iroh-docs = "0.101"
# noq quinn fork used by iroh 1.x — needed only for congestion::Bbr3Config
# (fe-sync BBR). Must match iroh's own noq-proto so ControllerFactory unifies;
# see fe-sync/src/AGENTS.md §congestion-control.
noq-proto = { version = "1.3", default-features = false }
# Migration-only: redb 2.6 is the last release that can upgrade a 0.35-written
# file-format-v2 store (docs.redb, blobs/blobs.db) to v3 before iroh-docs 0.101 /
# iroh-blobs 0.103 (redb 4) open it. See fe-sync/src/AGENTS.md §store-migration.
redb_v2 = { package = "redb", version = "2.6.4" }
# Feature-unification shim: netwatch 0.5.0 (iroh 0.35 dep) used socket2::Type::RAW
# on macOS without enabling socket2/all — declaring it here turns the feature
# on graph-wide so the macOS CI build compiles.
# TODO(iroh-1.x): netwatch is now 0.19.x; drop this shim once macOS CI passes without it.
socket2 = { version = "0.5", features = ["all"] }
ed25519-dalek = { version = "2.2", features = ["rand_core", "pkcs8"] }
jsonwebtoken = { version = "10.3", features = ["rust_crypto"] }
keyring = "3"
blake3 = "1"
bytes = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
# float_roundtrip: bit-exact f64 parsing (replication; see fe-sim/src/AGENTS.md §one-ulp).
serde_json = { version = "1", features = ["float_roundtrip"] }
anyhow = "1"
thiserror = "1"
ulid = "1"
rfd = "0.15"

[profile.release]
strip = true
lto = "fat"
codegen-units = 1
panic = "abort"
