[workspace]
members = [
    "fractalengine",
    "fe-runtime",
    "fe-network",
    "fe-database",
    "fe-identity",
    "fe-renderer",
    "fe-webview",
    "fe-sync",
    "fe-ui",
    "fe-test-harness",
    "fe-api",
    "fractalengine-relay",
    "fe-format",
    "fe-entity-store",
    "fe-query",
    "fe-terrain",
    "fe-hexon",
    "fe-hexon-registry",
    "fe-plugin",
    "fe-plugin-test",
    "fe-sdk",
    "fe-policy",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/JadeZaher/fractalengine"
rust-version = "1.83"

[workspace.dependencies]
bevy = { version = "0.18", default-features = false, features = [
    # 3D rendering pipeline (PBR, GLTF, gizmos, anti-alias, post-process)
    "3d_bevy_render",
    # App fundamentals (asset, state, window, logging, input focus)
    "default_app",
    # UI rendering (bevy_ui + render backend)
    "ui_bevy_render",
    # Scene serialization
    "scene",
    # Picking (mesh, sprite, UI)
    "bevy_picking", "mesh_picking", "sprite_picking", "ui_picking",
    # Platform (windowing, threading, fonts)
    "std", "bevy_winit", "default_font", "multi_threaded",
    # Linux display servers
    "x11", "wayland",
    # Diagnostics
    "sysinfo_plugin",
] }

bevy_egui = "0.39"
crossbeam = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
surrealdb = { version = "3.0", features = ["kv-surrealkv", "kv-mem"] }
libp2p = { version = "0.56", features = ["kad", "quic", "tokio", "macros"] }
iroh = "0.35"
iroh-blobs = "0.35"
iroh-gossip = "0.35"
iroh-docs = "0.35"
# quinn fork used by iroh 0.35 — needed only for congestion::BbrConfig (fe-sync BBR)
iroh-quinn-proto = "0.13"
# Feature-unification shim: netwatch 0.5.0 (iroh dep) uses socket2::Type::RAW
# on macOS without enabling socket2/all — declaring it here turns the feature
# on graph-wide so the macOS CI build compiles. Drop when iroh/netwatch fix it.
socket2 = { version = "0.5", features = ["all"] }
ed25519-dalek = { version = "2.2", features = ["rand_core", "pkcs8"] }
jsonwebtoken = { version = "10.3", features = ["rust_crypto"] }
keyring = "3"
blake3 = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
ulid = "1"
rfd = "0.15"

[profile.release]
strip = true
lto = "fat"
codegen-units = 1
panic = "abort"
