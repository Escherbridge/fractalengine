[package]
name = "fe-hexon-registry"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Hosted hexon registry HTTP service"

[dependencies]
axum = { workspace = true }
tokio = { workspace = true, features = ["fs"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
zip = { version = "2", default-features = false, features = ["deflate"] }
semver = "1"
# default-features = false: the only reason this was a dev-only duplicate
# (fe-runtime -> bevy) is gone since PAS-P5 S1 made `runtime` opt-in (S3 §1).
fe-format = { path = "../fe-format", default-features = false }

[dev-dependencies]
blake3 = { workspace = true }
ed25519-dalek = { workspace = true }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"
