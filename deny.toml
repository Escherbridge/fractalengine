# cargo-deny configuration — see THIRD-PARTY-LICENSES.md for the licensing policy.
# CI (build-artifacts.yml lint job, warn-only) runs
# `check advisories bans sources licenses`. The licences allow-list below is the
# ratified OSS-1.3 decision (2026-10-12, conductor/tracks/oss_release_20260717
# task 1.3): "allow all 7 outlier licences in deny.toml and turn cargo deny
# check licenses on in CI".

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    # The 7 outlier licences (OSS-1.3 decision 2026-10-12). Five are permissive
    # code/data licences, allowed globally:
    "Unlicense",           # async_io_stream, pharos, ws_stream_wasm, ext-sort
    "BSL-1.0",             # clipboard-win, error-code (Boost Software License, not BUSL)
    "CC0-1.0",             # constant_time_eq 0.1, hexf-parse, tiny-keccak
    "MIT-0",               # encase, encase_derive, encase_derive_impl
    "CDLA-Permissive-2.0", # webpki-roots, webpki-root-certs (Mozilla CA bundle data)
    # The other two (OFL-1.1, Ubuntu-font-1.0) are FONT licences and are scoped
    # to the one crate that embeds fonts -- see `exceptions` below.
]
# BUSL-1.1 permitted ONLY for the embedded SurrealDB engine crates (`surrealdb*`,
# see THIRD-PARTY-LICENSES.md). SurrealDB 3.x splits the engine across these five.
exceptions = [
    { name = "surrealdb", allow = ["BUSL-1.1"] },
    { name = "surrealdb-core", allow = ["BUSL-1.1"] },
    { name = "surrealdb-protocol", allow = ["BUSL-1.1"] },
    { name = "surrealdb-types", allow = ["BUSL-1.1"] },
    { name = "surrealdb-types-derive", allow = ["BUSL-1.1"] },
    # OSS-1.3 (2026-10-12): egui's bundled default fonts (Hack, Ubuntu-Light,
    # Noto Emoji, emoji-icon-font). Scoped, not global, so a code crate under a
    # font licence still has to be reviewed.
    { name = "epaint_default_fonts", allow = ["OFL-1.1", "Ubuntu-font-1.0"] },
]

# These surrealdb crates declare `license-file` (BUSL text), not an SPDX
# expression. The hash is cargo-deny's xxHash32 (seed 0) of the crate's LICENSE;
# a new SurrealDB release whose LICENSE text changes makes the clarification
# lapse (cargo-deny falls back to license-file detection) — recompute then.
[[licenses.clarify]]
crate = "surrealdb"
expression = "BUSL-1.1"
license-files = [{ path = "LICENSE", hash = 0xbb1191d7 }]

[[licenses.clarify]]
crate = "surrealdb-core"
expression = "BUSL-1.1"
license-files = [{ path = "LICENSE", hash = 0xbb1191d7 }]

[[licenses.clarify]]
crate = "surrealdb-types"
expression = "BUSL-1.1"
license-files = [{ path = "LICENSE", hash = 0xbb1191d7 }]

[[licenses.clarify]]
crate = "surrealdb-types-derive"
expression = "BUSL-1.1"
license-files = [{ path = "LICENSE", hash = 0xbb1191d7 }]

[advisories]
yanked = "warn"
# Unmaintained-only advisories fail the check only for crates the workspace
# depends on directly; transitive ones (paste, unic-*, instant, …) are upstream's.
unmaintained = "workspace"
# Every ignore below is a known, triaged vulnerability with no zero-graph-change
# fix available (see SECURITY.md "Known limitations" for the per-ID rationale).
ignore = [
    # wasmtime 29.0.1 (fe-plugin WASM host) — fixed only in later majors; the
    # plugin system is dormant (no plugin loaded at runtime, security audit
    # 2026-07-31). Upgrade tracked as a fe-plugin follow-up.
    { id = "RUSTSEC-2025-0046", reason = "wasmtime 29: fix needs a major bump; fe-plugin WASM host dormant" },
    { id = "RUSTSEC-2025-0118", reason = "wasmtime 29: fix needs a major bump; fe-plugin WASM host dormant" },
    { id = "RUSTSEC-2026-0006", reason = "wasmtime 29: fix needs a major bump; fe-plugin WASM host dormant" },
    { id = "RUSTSEC-2026-0020", reason = "wasmtime 29: fix needs a major bump; fe-plugin WASM host dormant" },
    { id = "RUSTSEC-2026-0021", reason = "wasmtime 29: fix needs a major bump; fe-plugin WASM host dormant" },
    { id = "RUSTSEC-2026-0085", reason = "wasmtime 29: fix needs a major bump; fe-plugin WASM host dormant" },
    { id = "RUSTSEC-2026-0086", reason = "wasmtime 29: fix needs a major bump; fe-plugin WASM host dormant" },
    { id = "RUSTSEC-2026-0087", reason = "wasmtime 29: fix needs a major bump; fe-plugin WASM host dormant" },
    { id = "RUSTSEC-2026-0088", reason = "wasmtime 29: fix needs a major bump; fe-plugin WASM host dormant" },
    { id = "RUSTSEC-2026-0089", reason = "wasmtime 29: fix needs a major bump; fe-plugin WASM host dormant" },
    { id = "RUSTSEC-2026-0091", reason = "wasmtime 29: fix needs a major bump; fe-plugin WASM host dormant" },
    { id = "RUSTSEC-2026-0092", reason = "wasmtime 29: fix needs a major bump; fe-plugin WASM host dormant" },
    { id = "RUSTSEC-2026-0093", reason = "wasmtime 29: fix needs a major bump; fe-plugin WASM host dormant" },
    { id = "RUSTSEC-2026-0094", reason = "wasmtime 29: fix needs a major bump; fe-plugin WASM host dormant" },
    { id = "RUSTSEC-2026-0095", reason = "wasmtime 29: fix needs a major bump; fe-plugin WASM host dormant" },
    { id = "RUSTSEC-2026-0096", reason = "wasmtime 29: fix needs a major bump; fe-plugin WASM host dormant" },
    { id = "RUSTSEC-2026-0222", reason = "wasmtime 29: fix needs a major bump; fe-plugin WASM host dormant" },
    { id = "RUSTSEC-2026-0269", reason = "wasmtime 29: fix needs a major bump; fe-plugin WASM host dormant" },
    { id = "RUSTSEC-2026-0316", reason = "wasmtime 29: fix needs a major bump; fe-plugin WASM host dormant" },
    # Transitive: the patch release re-resolves other crates (graph change).
    { id = "RUSTSEC-2026-0258", reason = "h2 0.4.14 (via hyper/reqwest): 0.4.16 re-resolves socket2/windows-sys — graph change" },
    { id = "RUSTSEC-2026-0285", reason = "rustls 0.23.40 (via iroh/reqwest): 0.23.45 bumps aws-lc-rs/aws-lc-sys — graph change" },
    { id = "RUSTSEC-2026-0257", reason = "webbrowser 1.2.1 (via bevy_egui; Unix BROWSER env only): 1.2.2 changes its dependency set — graph change" },
    # Transitive: fixed only in a new minor/major the upstream crate has not adopted.
    { id = "RUSTSEC-2026-0194", reason = "quick-xml 0.39 (via tauri plist, parses bundled Info.plist only): fixed in 0.41 only" },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml 0.39 (via tauri plist, parses bundled Info.plist only): fixed in 0.41 only" },
    # ruzstd 0.8.3 decompression bomb. bevy_image 0.18.1 (also 0.19.1, 0.20.0) pins ^0.8 and the
    # fix is 0.9.1 only. Pulled by bevy `3d_api` (ktx2 + zstd_rust, needed by the built-in
    # tonemapping/SMAA LUTs) and forced by bevy_egui's `zstd_rust`. Unguarded, a GLB embedding an
    # `image/ktx2` texture with Zstandard supercompression reaches ruzstd at load (peer-shared GLB
    # can OOM-crash the GUI; DoS, not code execution). MITIGATED 2026-10-13 by the KTX2 intake guard
    # (fe-runtime/src/ktx2_guard.rs, src/AGENTS.md §ktx2-guard), which refuses KTX2/Basis textures.
    # Revisit when a bevy release requires ruzstd >= 0.9.1: bump bevy, then drop this ignore AND
    # the guard. Until then SECURITY.md "Known limitations" records it.
    { id = "RUSTSEC-2026-0344", reason = "ruzstd 0.8.3 (via bevy_image ^0.8): fix is 0.9.1 only, no bevy release takes it; peer GLB with zstd KTX2 can OOM the GUI" },
    # Unmaintained, but a direct workspace dependency (fe-terrain baked-splat codec).
    { id = "RUSTSEC-2025-0141", reason = "bincode 1 (direct, fe-terrain splat/format.rs): unmaintained, no vulnerability; replacement is a follow-up" },
    { id = "RUSTSEC-2023-0071", reason = "rsa 0.9 (via jsonwebtoken; FE signs/verifies EdDSA only, RSA never used): no upstream fix exists" },
]

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "warn"
