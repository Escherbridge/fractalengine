# cargo-deny configuration — see THIRD-PARTY-LICENSES.md for the licensing policy.

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
]
# BUSL-1.1 permitted ONLY for the embedded SurrealDB engine (see THIRD-PARTY-LICENSES.md).
exceptions = [
    { name = "surrealdb", allow = ["BUSL-1.1"] },
    { name = "surrealdb-core", allow = ["BUSL-1.1"] },
]

# surrealdb crates declare `license-file` (BUSL text), not an SPDX expression.
# On first `cargo deny check licenses` run, fill each entry's license-files
# hash from the reported value if detection fails.
[[licenses.clarify]]
crate = "surrealdb"
expression = "BUSL-1.1"
license-files = []

[[licenses.clarify]]
crate = "surrealdb-core"
expression = "BUSL-1.1"
license-files = []

[advisories]
yanked = "warn"

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "warn"
