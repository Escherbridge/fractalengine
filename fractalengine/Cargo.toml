[package]
name = "fractalengine"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "FractalEngine GUI application — Bevy-based 3D spatial analytics client"

build = "build.rs"

[[bin]]
name = "fractalengine"
path = "src/main.rs"

# Windows .exe icon (assets/branding/icon.ico) — src/AGENTS.md §window-chrome.
# embed-resource is MIT and already in the graph via tauri-winres.
[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

[dev-dependencies]
tokio = { workspace = true }
ed25519-dalek = { workspace = true }
rand = "0.8"
fe-identity = { path = "../fe-identity" }
fe-webview = { path = "../fe-webview" }
fe-renderer = { path = "../fe-renderer" }
tempfile = "3"
# PAS-P5 S7b flow tests: an in-process fe-hexon-registry on an ephemeral port
# (mirrors fe-hexon/tests/support/registry_server.rs — not reusable as a lib
# from here, so the helper is reimplemented locally in terrain_bridge.rs's
# own test module).
fe-hexon-registry = { path = "../fe-hexon-registry" }
axum = { workspace = true }

[dependencies]
# PAS-P5 S7a: `terrain_bridge::verify_install_meta` parses `fe_format::HeaderDoc`
# and runs `verify_header` to gate the install-flow two-phase download —
# promoted from dev-dependencies (was S4 `terrain_bridge` test-fixture-only).
fe-format = { path = "../fe-format" }
# PAS-P5 S7b: hosted "install from registry" production path — the first
# production consumer of `FetchStrategy`/`RemoteRegistryClient` (A9, closing
# the "gate built but never wired" finding for the HTTP partial-fetch half).
fe-hexon = { path = "../fe-hexon", features = ["remote"] }
fe-runtime = { path = "../fe-runtime" }
fe-network = { path = "../fe-network" }
fe-database = { path = "../fe-database" }
fe-identity = { path = "../fe-identity" }
fe-sync = { path = "../fe-sync" }
fe-renderer = { path = "../fe-renderer" }
fe-ui = { path = "../fe-ui" }
fe-webview = { path = "../fe-webview", features = ["webview"] }
fe-api = { path = "../fe-api" }
fe-entity-store = { path = "../fe-entity-store" }
fe-terrain = { path = "../fe-terrain", features = ["render"] }
bevy = { workspace = true }
bevy_egui = { workspace = true }
crossbeam = { workspace = true }
tokio = { workspace = true }
iroh = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
hex = "0.4"
dirs = "5"
rfd = { workspace = true }
anyhow    = { workspace = true }
surrealdb = { workspace = true }
serde_json = { workspace = true }
# PNG decode (app icon) + encode (window screenshots); same 0.25 line bevy_image
# uses, so `Image::try_into_dynamic` output is this crate's `DynamicImage`.
image = { version = "0.25", default-features = false, features = ["png"] }
# `Icon::from_rgba` for the window/taskbar icon — same 0.30 line bevy_winit pins.
winit = { version = "0.30", default-features = false }
