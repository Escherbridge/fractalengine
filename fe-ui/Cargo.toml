[package]
name = "fe-ui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "egui-based user interface panels and tools for FractalEngine"

[dependencies]
bevy = { workspace = true }
bevy_egui = { workspace = true }
crossbeam = { workspace = true }
fe-database = { path = "../fe-database" }
fe-runtime = { path = "../fe-runtime" }
fe-renderer = { path = "../fe-renderer" }
fe-sync = { path = "../fe-sync" }
fe-webview = { path = "../fe-webview" }
fe-sdk = { path = "../fe-sdk" }
fe-hexon = { path = "../fe-hexon" }
# Client-DID validation for the API-token GUI (W6-7b) — real dependency, not
# test-only; see fe-ui/src/AGENTS.md §app-settings / TOKEN-CLIENT-CLAIM.
fe-identity = { path = "../fe-identity" }
url = { version = "2", features = ["serde"] }
serde = { workspace = true }
serde_json = { workspace = true }
ulid = { workspace = true }

chrono = "0.4"
rfd = { workspace = true }
# AppSettings persistence (settings.ron under the platform config dir).
ron = "0.12"
dirs = "5"

[dev-dependencies]
tempfile = "3"
