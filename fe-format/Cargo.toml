[package]
name = "fe-format"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Canonical data formats and scope strings for FractalEngine"

[features]
# `runtime` pulls fe-runtime (and through it bevy) for `From<NodeDto>` and the
# shared `is_safe_path_id` guard; bevy-free consumers use `default-features = false`
# (see src/AGENTS.md §features).
default = ["runtime"]
runtime = ["dep:fe-runtime"]
# EdDSA entitlement tokens, X25519 content-key wrap and paid-entry sealing (src/AGENTS.md §entitlement).
entitlement = ["dep:jsonwebtoken", "dep:x25519-dalek", "dep:chacha20poly1305"]

[dependencies]
fe-runtime = { path = "../fe-runtime", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
zip = { version = "2", default-features = false, features = ["deflate"] }
anyhow = { workspace = true }
thiserror = { workspace = true }
blake3 = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }
ed25519-dalek = { workspace = true }
base64 = "0.22"
bs58 = "0.5"
jsonwebtoken = { workspace = true, optional = true }
x25519-dalek = { workspace = true, optional = true }
chacha20poly1305 = { workspace = true, optional = true }

[dev-dependencies]
rand = "0.8"
