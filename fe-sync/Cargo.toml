[package]
name = "fe-sync"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "iroh-based P2P synchronization and replication for FractalEngine"

[features]
relay-server = ["dep:iroh-relay", "iroh-relay/server"]

[dependencies]
bevy = { workspace = true }
fe-runtime = { path = "../fe-runtime" }
fe-database = { path = "../fe-database" }
fe-network = { path = "../fe-network" }
fe-policy = { path = "../fe-policy" }
fe-identity = { path = "../fe-identity" }
fe-canonical-log = { path = "../fe-canonical-log" }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
dirs = "5"
blake3 = { workspace = true }
hex = "0.4"
iroh = { workspace = true, features = ["unstable-net-report"] }
iroh-relay = { workspace = true, optional = true }
iroh-blobs = { workspace = true }
iroh-docs = { workspace = true }
iroh-gossip = { workspace = true }
noq-proto = { workspace = true }
# migration-only (0.35 store v2->v3 file-format upgrade) — see src/AGENTS.md §store-migration
redb_v2 = { workspace = true }
bytes = { workspace = true }
async-trait = "0.1"
futures-lite = "2.3"
# see workspace Cargo.toml — socket2/all shim for netwatch's macOS build
socket2 = { workspace = true }
crossbeam = { workspace = true }
# dial-back prober (https GET to an advertised relay) and signed dial-back records
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
ed25519-dalek = { workspace = true }

[dev-dependencies]
iroh = { workspace = true, features = ["test-utils"] }
ulid = { workspace = true }
tempfile = "3"
