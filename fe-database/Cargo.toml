[package]
name = "fe-database"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Embedded SurrealDB persistence layer with op-log write path"

[dependencies]
fe-runtime = { path = "../fe-runtime" }
fe-identity = { path = "../fe-identity" }
# `parquet`: the SPEC-10 observation hexon codec the B3 sealer and hydrator use
# (`canon_log/AGENTS.md` §observation; campaign plan §5 risk 8).
fe-query = { path = "../fe-query", features = ["parquet"] }
fe-policy = { path = "../fe-policy" }
fe-canonical-log = { path = "../fe-canonical-log" }
# SPEC-10 §4.5 legacy_identifier (migration/AGENTS.md §transform-mapping).
fe-sdk = { path = "../fe-sdk" }
surrealdb = { workspace = true }
# SurrealQL's own parser counts an elevated script's statements (EL-1/EL-3,
# src/AGENTS.md §handlers "elevated"). The exact version `surrealdb` already
# pulls in, no extra features — so it never rebuilds the engine.
surrealdb-core = { version = "=3.0.5", default-features = false }
async-trait = "0.1"
tokio = { workspace = true }
tracing = { workspace = true }
crossbeam = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
ulid = { workspace = true }
bevy = { workspace = true }
chrono = "0.4"
base64 = "0.22"
hex = "0.4"
blake3 = { workspace = true }
ed25519-dalek = { workspace = true }
rand = "0.8"
iroh = { workspace = true }
iroh-docs = { workspace = true }

[dev-dependencies]
crossbeam = { workspace = true }
surrealdb = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
tempfile = "3"
# seed_join_verse's bind-terrain writes a real TerrainConfig (DEC-C22 FIX H):
# fe-terrain has no fe-database dependency (checked, no cycle), default
# features only (no "render"/bevy pulled in).
fe-terrain = { path = "../fe-terrain" }

[package.metadata.env]
SURREAL_SYNC_DATA = "true"
